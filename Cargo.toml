[workspace]
resolver = "2"
members = [
    "crates/studio_ui",
    "crates/studio_graph",
    "crates/studio_canvas",
    "crates/studio_parser",
    "crates/studio_viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
# Internal workspace crates
studio_ui = { path = "crates/studio_ui" }
studio_graph = { path = "crates/studio_graph" }
studio_canvas = { path = "crates/studio_canvas" }
studio_parser = { path = "crates/studio_parser" }

# Common dependencies
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "glow", "wayland", "x11", "persistence"] }
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl"] }
serde = { version = "1.0", features = ["derive"] }
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
walkdir = "2.5"
toml = "0.8"
rfd = "0.17.2"
rayon = "1.10"
bytemuck = { version = "1.19", features = ["derive"] }
rkyv = { version = "0.8.18", features = ["std", "bytecheck"] }
memmap2 = "0.9"
dirs = "6.0"
egui-phosphor = { version = "0.14.0", default-features = false, features = ["regular"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }
rustc-hash = "2.1"
libc = "0.2"
tempfile = "3.27"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-dart = "0.2.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-scala = "0.26.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"

