[workspace]
resolver = "2"
members = [
    "crates/studio_ui",
    "crates/studio_graph",
    "crates/studio_canvas",
    "crates/studio_parser",
    "crates/studio_viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[workspace.dependencies]
# Internal workspace crates
studio_ui = { path = "crates/studio_ui" }
studio_graph = { path = "crates/studio_graph" }
studio_canvas = { path = "crates/studio_canvas" }
studio_parser = { path = "crates/studio_parser" }

# Common dependencies
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "wgpu", "glow", "wayland", "x11"] }
egui = "0.28"
egui-wgpu = { version = "0.28", default-features = false }
wgpu = { version = "0.20", default-features = false, features = ["wgsl"] }
serde = { version = "1.0", features = ["derive"] }
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
walkdir = "2.5"
toml = "0.8"
rfd = "0.15"
rayon = "1.10"
bytemuck = { version = "1.19", features = ["derive"] }
glow = "0.13"
rkyv = { version = "0.8.18", features = ["std", "bytecheck"] }
memmap2 = "0.9"
dirs = "6.0"
egui-phosphor = { version = "0.6.0", default-features = false, features = ["regular"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }
rustc-hash = "2.1"
libc = "0.2"
tempfile = "3.27"

