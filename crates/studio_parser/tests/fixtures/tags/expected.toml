# Every tag the fixture holds and every contract resolution. Paths are relative to this folder.
# owner = the name of the item the tag documents, or "file".

[[route]]
file = "mod/Scripts/Game/ThingReporter.c"
line = 4
methods = ["POST"]
templates = ["/api/v1/things/{id}/done", "/api/v1/things/{id}/start"]
owner = "SendReport"

[[route]]
file = "src/handlers.rs"
line = 7
methods = ["POST"]
templates = ["/api/v1/things/:thingId/done"]
owner = "done"

[[route]]
file = "tools/cleanup.py"
line = 4
methods = ["DELETE"]
templates = ["/api/v1/things/{id}"]
owner = "delete_thing"

[[route]]
file = "web/client.ts"
line = 3
methods = ["GET"]
templates = ["/api/v1/things"]
owner = "listThings"

