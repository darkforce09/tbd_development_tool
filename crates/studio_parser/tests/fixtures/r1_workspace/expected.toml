# Exact expectations of tests/r1.rs. Paths are relative to this folder.
#
# `expect` forms: "item <Kind> <name> <file>:<line>", "external <path>",
# "ambiguous <file>:<line>, <file>:<line>", "unresolved <Reason>" (Other reasons as "unresolved Other: <text>").
# Every call site the index reads must be listed under [[call]], and every listed one must be read.

[index]
modules = 23
files = 14

[[crate]]
package = "alpha"
name = "alpha"
kind = "Lib"
root = "alpha/src/lib.rs"
edition = 2021
deps = []
external = ["axum"]

[[crate]]
package = "beta"
name = "beta"
kind = "Lib"
root = "beta/src/lib.rs"
edition = 2021
# `legacy_core` is the library name of package `legacy-lib` (not renamed); `twin` names two crates, so it is in
# neither list.
deps = ["alpha", "legacy_core", "unixonly"]
external = []
gated = ["twin", "unixonly"]

[[crate]]
package = "gamma-tool"
name = "gamma_tool"
kind = "Lib"
root = "gamma_tool/src/lib.rs"
edition = 2021
deps = ["b"]
external = []

[[crate]]
package = "gamma-tool"
name = "extra"
kind = "Bin"
root = "gamma_tool/src/bin/extra.rs"
edition = 2021
deps = ["b", "gamma_tool"]
external = []

[[crate]]
package = "gamma-tool"
name = "gamma-tool"
kind = "Bin"
root = "gamma_tool/src/main.rs"
edition = 2021
deps = ["b", "gamma_tool"]
external = []

# No `edition` in the manifest: 2015.
[[crate]]
