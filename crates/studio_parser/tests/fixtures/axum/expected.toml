# Exact route table of the axum fixture, in table order (canonical template, method, `.route(` line).
# `handler` is the R1 target as "file:line" (the function's name line) or the unresolved reason.
# `conditional` is omitted for unconditional routes. The main roots are the two serve sites of web's bins: main.rs
# hands a binding to `axum::serve`, relay.rs makes the service in the `let` itself.
# Left out by rule: web/tests/stub.rs (an integration test), `#[cfg(test)] mod t` in web/src/lib.rs and the
# `#[cfg(test)]` statements in web/src/more.rs. The unreferenced router functions of web/src/more.rs and
# web/src/extra.rs are roots of their own; extra.rs is a `#[cfg(feature = "extra")]` module, so its routes carry that
# condition. The router functions more.rs nests from code that is not an evaluated root are skipped, never roots.
services = 2 # web/src/router.rs:19 nest_service, web/src/bin/relay.rs:9 fallback

[[entry]]
method = "ANY"
template = "/api/v1/any"
handler = "things/src/handlers/things.rs:3"
handler_text = "handlers::things::list"
at = "things/src/routes.rs:22"
root = "web/src/main.rs:6"

