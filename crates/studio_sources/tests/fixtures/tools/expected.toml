# What tools.rs finds in this folder (tests/tools_fixture.rs reads the packages from the manifests and passes
# every file, sorted). Checked by hand against the files here.
#
# Order: cargo aliases (key order), then each package by name (binaries, then examples), then the files in path
# order (.github/workflows/ci.yml, Makefile, justfile, web/package.json).
#
# - xtask: one binary, run by the `xtask` alias, whose parser lives in src/cli.rs. Its subcommands nest through
#   a field (`deploy`, `cache`), through an `Args` struct (`db`, `cache clear`), and `deploy`'s enum is
#   `ops::DeployCmd`, defined in ops/src/deploy.rs and re-exported from ops/src/lib.rs. `#[command(skip)]`
#   hides `Internal`; `#[command(name = "fmt-all")]` renames `FormatAll`.
# - cli: two binaries (one with its own parser in src/bin/stats.rs) and an example; no alias runs them.
# - Makefile: no `.PHONY`, variable or pattern rule; `clean dist:` defines two targets.
# - justfile: no setting, alias or variable; `@release` is `release`; `[private]` is no comment.
# - web/package.json: scripts in file order, run with pnpm (web/pnpm-lock.yaml).
#
# Lines: "kind name (file:line) $ invocation # description", children indented two spaces per level.

