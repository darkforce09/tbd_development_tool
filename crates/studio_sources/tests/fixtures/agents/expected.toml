# What `index_sessions` must find in `claude/` (format version 1 of the session logs).
# Placeholders in the logs, filled by the test: {ROOT} the repo (roots = [{ROOT}, {ROOT}/wt]),
# {LINK} a symlink to it, {OTHER} an unrelated folder, {PARENT} the repo's parent, {CLAUDE}
# the fake ~/.claude. Every prompt, content, old/new string, command and task subject in the
# logs and plan files holds the marker below; no cache byte may.
marker = "SECRET-PROMPT-7f3a"

# s7 starts outside the repo and moves into the worktree later (mapped by that line, D2 "any
# line"); s8 only names the repo inside a tool input (not mapped).
sessions = 5
main_logs = 5
subagent_logs = 1
# Complete lines in the mapped logs (s2's incomplete last line waits for its newline).
lines = 64
bad_lines = 1
# s3 copies three of s1's lines (resume); they count once, for s1.
duplicate_lines = 3
# s1 edits {OTHER}/elsewhere.txt (folder on disk); s7 edits {PARENT}/gone-wt/src/x.rs (gone).
out_of_repo_touches = 2
out_of_repo_gone = 1
out_of_repo_existing = 1
# Folder (relative to {PARENT}, the deepest folder holding the roots' parents) and count.
out_of_repo_top = [["gone-wt", 1], ["other", 1]]
# Main logs and sessions mapped by a line after the first cwd.
later_cwd_logs = 1
later_cwd_sessions = 1
folders = 6
folders_mapped = ["-link", "-moved", "-repo-a", "-repo-a-wt"]

[unknown_types]
queue-operation = 1
custom-title = 1
relocated = 1
atis-latch = 1

[touches]
read = 4
edit = 6
write = 2
bash_edit = 1
subagent = 2

# Touches per file, relative to {ROOT}.
[per_file]
"src/lib.rs" = 5
"src/new.rs" = 1
"src/main.rs" = 1
"docs/rel.md" = 1
"README.md" = 2
"src/resumed.rs" = 1
"wt/a.rs" = 1
"wt/b.rs" = 1

